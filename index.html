<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link id="favicon-96" rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link id="favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link id="favicon-shortcut" rel="shortcut icon" href="/favicon.ico" />
  <link id="favicon-apple" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-title" content="%VITE_STORE_NAME%" />

  <link id="app-manifest" rel="manifest" href="/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title id="page-title">%VITE_STORE_NAME%</title>
  <meta id="meta-description" name="description" content="%VITE_STORE_DESCRIPTION%" />
  <meta name="keywords" content="%VITE_SEO_KEYWORDS%" />
  <meta name="robots" content="index, follow" />

  <meta id="og-title" property="og:title" content="%VITE_STORE_NAME%" />
  <meta id="og-description" property="og:description" content="%VITE_STORE_DESCRIPTION%" />
  <meta id="og-type" property="og:type" content="website" />
  <meta id="og-url" property="og:url" content="%VITE_STORE_URL%" />
  <meta id="og-image" property="og:image" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta id="twitter-title" name="twitter:title" content="%VITE_STORE_NAME%" />
  <meta id="twitter-description" name="twitter:description" content="%VITE_STORE_DESCRIPTION%" />
  <meta id="twitter-image" name="twitter:image" content="" />

  <style>
    .goog-te-banner-frame.skiptranslate {
      display: none !important;
    }

    body {
      top: 0px !important;
    }

    .goog-logo-link {
      display: none !important;
    }

    .goog-te-gadget {
      color: transparent !important;
    }
  </style>

  <script type="text/javascript">
    window.__deferredInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent("pwa-install-ready"));
    });

    window.addEventListener("appinstalled", function () {
      window.__deferredInstallPrompt = null;
      window.dispatchEvent(new CustomEvent("pwa-app-installed"));
    });
  </script>

  <script type="text/javascript">
    (function () {
      var defaultSellerId = "%VITE_DEFAULT_SELLER_ID%";
      var apiUrl = "%VITE_API_URL%";
      var sellerId = localStorage.getItem("seller_id") || defaultSellerId;

      if (!sellerId || !apiUrl) return;

      var currentOrigin = window.location.origin;

      function setMeta(id, attr, value) {
        var el = document.getElementById(id);
        if (el && value) el.setAttribute(attr, value);
      }

      fetch(apiUrl + "/manifest/" + sellerId)
        .then(function (res) {
          if (!res.ok) throw new Error("Manifest request failed: " + res.status);
          return res.json();
        })
        .then(function (manifest) {
          manifest.start_url = currentOrigin + "/customer";
          manifest.scope = currentOrigin + "/";

          if (manifest.icons) {
            manifest.icons.forEach(function (icon) {
              if (icon.src.startsWith("/")) {
                icon.src = currentOrigin + icon.src;
              }
            });
          }

          var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
          var manifestLink = document.getElementById("app-manifest");
          if (manifestLink) {
            manifestLink.href = URL.createObjectURL(blob);
          }
        })
        // Keep the static manifest when the seller-specific API is unavailable.
        .catch(function () { });
      fetch(apiUrl + "/customer/store/" + sellerId)
        .then(function (res) { return res.json(); })
        .then(function (res) {
          if (!res || !res.success || !res.data) return;

          var storeData = res.data;
          var profile = storeData.store_profile || {};
          var logo = profile.logo;

          if (logo) {
            var faviconUrl = logo.replace("/upload/", "/upload/f_png,w_96,h_96,c_fill,g_auto/");
            ["favicon-96", "favicon-svg", "favicon-shortcut", "favicon-apple"].forEach(function (id) {
              var el = document.getElementById(id);
              if (el) el.href = faviconUrl;
            });
            setMeta("og-image", "content", logo);
            setMeta("twitter-image", "content", logo);
          }
        })
        .catch(function () { });
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <div id="google_translate_element" style="display: none;"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'hi,en',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript"
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
